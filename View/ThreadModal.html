<div id="thread-modal" class="modal">
    <div class="thread-modal-content">

        <div class="thread-modal-header">
            <span>Thread</span>
            <span class="close-thread-modal">&times;</span>
        </div>

        <div id="original-post-container"></div>

        <div id="reply-input-section">
            <textarea id="reply-content" rows="3" placeholder="Write a reply..."></textarea>
            <div id="reply-attachment-preview"></div>
            <div class="reply-actions">
                <label for="reply-attachment" class="attach-btn">+ attach image</label>
                <input type="file" id="reply-attachment" accept="image/*" style="display:none;">
                <button id="submit-reply-btn">Post reply</button>
            </div>
        </div>

        <div class="thread-replies-label">Replies</div>

        <div id="thread-container"></div>

    </div>
</div>
