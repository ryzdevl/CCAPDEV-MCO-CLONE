<!DOCTYPE html>
<html>
<head>
    <title>INKLING</title>
    <link rel="stylesheet" href="UserPage.css">
    <link rel="stylesheet" href="TLPostStyle.css">
    <link rel="stylesheet" href="ThreadModal.css">
    <link href='https://fonts.googleapis.com/css?family=Figtree:400,300,700' rel='stylesheet' type='text/css'> 
</head>
<body>
    <div class="mainpage">
        <header>
             <div class="logo">
                <img id="header-logo" src="assets/logo-darkmode.png" alt="My Logo">
            </div>

            <div class="header-buttons">
                <a href="main timeline.html" class="headerbutton">Timeline</a>
                <a href="Home-Page.html" class="headerbutton">Back to Home</a>
            </div>

            <button id="theme-switch">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M565-395q35-35 35-85t-35-85q-35-35-85-35t-85 35q-35 35-35 85t35 85q35 35 85 35t85-35Zm-226.5 56.5Q280-397 280-480t58.5-141.5Q397-680 480-680t141.5 58.5Q680-563 680-480t-58.5 141.5Q563-280 480-280t-141.5-58.5ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Zm326-268Z"/></svg>
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Zm0-80q88 0 158-48.5T740-375q-20 5-40 8t-40 3q-123 0-209.5-86.5T364-660q0-20 3-40t8-40q-78 32-126.5 102T200-480q0 116 82 198t198 82Zm-10-270Z"/></svg>
            </button>
        </header>


        <!-- USER PORTION -->
        <div class="user-part" id="user-part" style="background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('../assets/defaultcover.jpg'); background-size: cover; background-position: center;">
            <section class="profile-section">
                <div class="profile-header">
                    <article class="profile-article">
                        <img src="../assets/defaultuser.png" class="profile-pic" id="profile-img"> <!-- Set to test.png by default upon account creation -->
                        <div class="profile-text">
                            <h2 class="display-name"id="profile-dn">User</h2>
                            <h3 class="user-id" id="profile-uid">@user</h3>
                            <h4 class="followers" style="font-size: 12px; margin:5px;" id="profile-stats">
                                <span id="followers-count" class="clickable">0 Followers</span> |
                                <span id="following-count" class="clickable">0 Following</span>
                            </h4>
                            <p id="profile-bio">This is my user bio!!!!</p>
                        </div>
                    </article>

                    <div class="profile-actions">
                        <a href="#" id="follow-btn" class="action-btn" style="display: none;">Follow</a> 
                        <a href="#" id="toggle-contact" class="action-btn">Contact me</a>
                        <a href="#" id="gallery-modal-btn" class="action-btn">Gallery</a>
                        <a href="#" id="post-modal" class="action-btn">Post</a>
                        <a href="#" id="profile-settings" class="action-btn">Profile Settings</a>
                    </div>
                </div>

                <div class="profile-lists">
                    <ul class="profile-hashtags">
                    </ul>
                </div>
         </section>
        </div>

        <!-- POSTS PORTION -->
        <main class="user-posts">

            <aside class="highlights-section">
                <h3>Highlights!</h3>
            </aside>

            <div class="posts-section-border">
                <div class="posts-section">
                <h3 id="post-header">User posts</h3>
                </div>
            </div>
        </main>

        <!-- CONTACT PORTION -->
        <main class="user-contact">
            <aside class="contact-links">
                <h3>Other Contact Links!</h3>
                    <ul>
                    </ul>
            </aside>


            <div class="contact-section"> 
                <ul class="contact-section-header">
                    <li><a href="#contact-section" class="contact-tab">Contact page</a></li>
                    <li><a href="#faq-section" class="faq-tab">Messages</a></li>
                </ul>

                <form id="contact-section-form">
                    <div id="form-top">
                        <input type="text" id="contact-user-id" name="user-id" value="@username">
                        <input type="date" id="contact-date" name="contact-date"><br>
                    </div>

                    <br>

                    <div id="form-bottom">
                        <input type="text" id="contact-purpose" name="contact-purpose" placeholder="Purpose for contact" value="Purpose"><br>
                        <textarea id="description" name="description" rows="4" cols="45">bruh</textarea>

                        <input type="submit" value="submit">
                    </div>
                </form>

                <div id="faq-section">
               
                </div>
            </div>
        </main>

          <!-- IMAGE LIGHTBOX MODAL -->
        <div id="image-lightbox" class="image-lightbox">
            <div class="lightbox-overlay" onclick="closeLightbox()"></div>
            <div class="lightbox-container">
                <button class="lightbox-close" onclick="closeLightbox()">✕</button>
                <button class="lightbox-nav lightbox-prev" onclick="lightboxPrev()">&#8249;</button>
                <button class="lightbox-nav lightbox-next" onclick="lightboxNext()">&#8250;</button>
                <div class="lightbox-main">
                    <img id="lightbox-main-img" src="" alt="Preview">
                </div>
                <div class="lightbox-thumbnails" id="lightbox-thumbnails"></div>
                <div class="lightbox-counter" id="lightbox-counter"></div>
            </div>
        </div>
        
        <!-- EDIT POST MODAL -->
        <div id="edit-post-modal" style="display:none; position:fixed; inset:0; z-index:10001; background:rgba(0,0,0,0.6); align-items:center; justify-content:center;">
            <div id="edit-post-box">
                <h3>Edit Post</h3>
                <textarea id="edit-post-content" rows="4"></textarea>
                <div id="edit-attachments-preview"></div>
                <label for="edit-new-files" class="btn">+ Add Images</label>
                <input type="file" id="edit-new-files" multiple accept="image/*" style="display:none">
                <div class="edit-modal-buttons">
                    <button id="edit-save-btn">Save</button>
                    <button id="edit-cancel-btn">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <footer><h3><a href="#" id="open-report-modal">Report an Issue</a></h3></h2></footer>

    <!-- FOR REPORT POPUP -->
    <div id="report-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <iframe src=" ReportPage.html" id="report-iframe" width="100%" height="600" style="border: none;"></iframe>
        </div>
    </div>

    <!-- FOR POST POPUP -->
    <div id="post-composer-modal" class="modal">
        <div class="modal-content">
            <span class="close-post-modal">&times;</span>
            <iframe src=" PostModal.html" id="post-iframe" style="border: none;"></iframe>
        </div>
    </div>

    <!-- FOR PROFILE SETTINGS POPUP -->
    <div id="profile-settings-modal" class="modal">
        <div class="modal-content">
            <span class="close-profile-modal">&times;</span>
            <iframe src="Profile-Edit.html" id="profile-iframe" width="100%" height="600" style="border: none;"></iframe>
        </div>
    </div>

    <!-- FOR GALLERY POPUP -->
    <div id="gallery-modal" class="modal">
        <div class="modal-content">
            <span class="close-gallery-modal">&times;</span>
            <iframe src=" UserGallery.html" id="gallery-iframe" width="100%" height="600" style="border: none;"></iframe>
        </div>
    </div>

     <!-- FOLLOWING/ FOLLOWER LIST POP UP -->
    <div id="followers-modal" class="modal">
        <div class="modal-content">
            <span class="close-followers">&times;</span>
            <h3 id="modal-title"></h3>
            <ul id="followers-list"></ul>
        </div>
    </div>

    <!-- FOR THREADS -->
    <div id="thread-modal-placeholder"></div>

</body>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="Lightbox.js"></script>
<script src="themeswitch.js"></script>
<script src="popup script.js"></script> <!-- Thank u bea this will now allow the zoom in on imgs and files from postlayout-->
<script src="TLPostLayout.js"></script>
<script src="ThreadManager.js"></script>
<script src= "UserPage.js"></script>
<script src="ContactPage.js"></script>
<script src="MessagePage.js"></script>
<script src=""></script>
</html>
