<div class="post" data-post-id="{{postId}}" data-is-shared="{{isShared}}">
    <img src="{{profilePic}}" class="post-profile-pic"> 
    
    <div class="post-content">
        <h2 class="display-name">{{displayName}}</h2>
        <h3 class="user-id">{{userId}}</h3>

        <!-- shared label -->
        {{sharedLabel}}

        <p>{{content}}</p>

        <!-- embedded original post (only shows if shared) -->
        {{embeddedPost}}

        <div class="attachments-container">
            {{attachments}}
        </div>
            
        <div class="post-interactions">
            <button class="interaction-btn updoot-btn" data-post-id="{{postId}}">
                <img src="/assets/updoot.png">
                <span class="updoot-count">{{updootsUp}}</span>
            </button>
            <button class="interaction-btn downdoot-btn" data-post-id="{{postId}}">
                <img src="/assets/downdoot.png">
                <span class="downdoot-count">{{updootsDown}}</span>
            </button>
            <button class="interaction-btn comment-btn" data-post-id="{{postId}}">
                <img src="/assets/comment.png">
                <span class="comment-count">{{commentCount}}</span>
            </button>
            <button class="interaction-btn star-btn" data-post-id="{{postId}}">
                <img src="/assets/star.png">
                <span class="star-count">{{starCount}}</span>
            </button>
            <button class="interaction-btn share-btn" data-post-id="{{postId}}">
                <img src="/assets/share.png">
                <span class="share-count">{{shareCount}}</span>
            </button>
        </div>
    </div>
</div>
