<!-- TLPost.html -->
<div class="post" data-post-id="{{postId}}" data-user-id="{{userId}}" data-is-shared="{{isShared}}">
    <img src="{{profilePic}}" class="post-pfp">
    <div class="post-content">
        <div class="post-userinfo">
            <span class="post-displayname">{{displayName}}</span>
            <span class="post-username">{{username}}</span>
            <span class="post-date">{{postDate}}</span>
            {{editedLabel}}
            {{postActions}} <!--Adds the share button to the post-->
        </div>
        
        {{sharedLabel}}
        
        <div class="post-body">
            <span class="post-text">{{content}}</span>
        </div>
        
        {{embeddedPost}}
        
        <div class="attachments-container">
            {{attachments}}
        </div>
        
        <div class="postsymbols">
            <!-- Updoot -->
            <label class="action-item" data-action="updoot">
                <input type="checkbox" class="updootbutton" {{isLiked}}>
                <span class="counter">{{updootsUp}}</span>
                <svg class="post-action empty" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path d="M440-320h80v-168l64 64 56-56-160-160-160 160 56 56 64-64v168Zm40 240q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/></svg>
                <svg class="post-action filled" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M440-320h80v-168l64 64 56-56-160-160-160 160 56 56 64-64v168Zm40 240q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Z"/></svg>
            </label>
            
            <!-- Downdoot -->
            <label class="action-item" data-action="downdoot">
                <input type="checkbox" class="downdootbutton" {{isDisliked}}>
                <span class="counter">{{updootsDown}}</span>
                <svg class="post-action empty" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path d="m480-320 160-160-56-56-64 64v-168h-80v168l-64-64-56 56 160 160Zm0 240q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/></svg>
                <svg class="post-action filled" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="m480-320 160-160-56-56-64 64v-168h-80v168l-64-64-56 56 160 160Zm0 240q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Z"/></svg>
            </label>
            
            <!-- Star (Highlight) - Add checked state -->
            <label class="action-item" data-action="star">
                <input type="checkbox" class="starbutton" {{isHighlighted}}>
                <span class="counter">{{starCount}}</span>
                <svg class="post-action empty" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#D9D9D9"><path d="m354-287 126-76 126 77-33-144 111-96-146-13-58-136-58 135-146 13 111 97-33 143ZM233-120l65-281L80-590l288-25 112-265 112 265 288 25-218 189 65 281-247-149-247 149Zm247-350Z"/></svg>
                <svg class="post-action filled" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="m233-120 65-281L80-590l288-25 112-265 112 265 288 25-218 189 65 281-247-149-247 149Z"/></svg>
            </label>
            
            <!-- Message/Comment -->
            <label class="action-item" data-action="message">
                <input type="checkbox" class="messagebutton">
                <span class="counter">{{commentCount}}</span>
                <svg class="post-action empty" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path d="M240-400h480v-80H240v80Zm0-120h480v-80H240v80Zm0-120h480v-80H240v80ZM880-80 720-240H160q-33 0-56.5-23.5T80-320v-480q0-33 23.5-56.5T160-880h640q33 0 56.5 23.5T880-800v720ZM160-320h594l46 45v-525H160v480Zm0 0v-480 480Z"/></svg>
                <svg class="post-action filled" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M240-400h480v-80H240v80Zm0-120h480v-80H240v80Zm0-120h480v-80H240v80Zm-80 400q-33 0-56.5-23.5T80-320v-480q0-33 23.5-56.5T160-880h640q33 0 56.5 23.5T880-800v720L720-240H160Z"/></svg>
            </label>
            
            <!-- Share -->
            <label class="action-item" data-action="share">
                <input type="checkbox" class="sharebutton">
                <span class="counter">{{shareCount}}</span>
                <svg class="post-action" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#D9D9D9"><path d="M240-80q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640h120v80H240v400h480v-400H600v-80h120q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240Zm200-240v-447l-64 64-56-57 160-160 160 160-56 57-64-64v447h-80Z"/></svg>
            </label>
        </div>
    </div>
</div>
