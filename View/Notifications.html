<!DOCTYPE html>
<html>
<head>
    <title>Notifications — Inkling</title>
    <link rel="stylesheet" href="../stylesheet.css">
    <link rel="stylesheet" href="tl.css">
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="text/javascript" src="../themeswitch.js" defer></script>
    <style>
        
        .notif-feed {
            height: 80vh;
            overflow-y: auto;
            padding-top: 0;
            padding-bottom: 40px;
            box-sizing: border-box;
            scrollbar-width: none;
            position: fixed;
            bottom: 0;
            justify-self: center;
            width: 40vw;
            display: flex;
            flex-direction: column;
        }

        .notif-feed::-webkit-scrollbar { display: none; }

        .notif-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 4px 14px;
            border-bottom: 1px solid #824882;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .notif-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .notif-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--posts);
            font-family: 'Figtree';
        }

        .notif-header-actions {
            display: flex;
            gap: 8px;
        }

        .notif-action-btn {
            background: transparent;
            border: 1.5px solid #824882;
            border-radius: 20px;
            color: var(--secondary);
            font-family: 'Figtree';
            font-size: 12px;
            font-weight: 600;
            padding: 5px 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .notif-action-btn:hover {
            background-color: #824882;
            color: var(--main);
        }

        .notif-action-btn.danger {
            border-color: #c0506e;
            color: #c0506e;
        }

        .notif-action-btn.danger:hover {
            background-color: #c0506e;
            color: #fff;
        }

        /* ── Unread banner ── */
        .unread-banner {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            margin-bottom: 10px;
            background-color: transparent;
            border: 1.5px solid #824882;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
            flex-shrink: 0;
        }

        .unread-banner.hidden { display: none; }

        .unread-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            flex-shrink: 0;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ── Filter tabs ── */
        .filter-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
            overflow-x: auto;
            scrollbar-width: none;
            flex-shrink: 0;
        }

        .filter-bar::-webkit-scrollbar { display: none; }

        .filter-tab {
            background: transparent;
            border: 1.5px solid #824882;
            border-radius: 20px;
            color: var(--secondary);
            font-family: 'Figtree';
            font-size: 12px;
            font-weight: 600;
            padding: 5px 14px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .filter-tab:hover {
            background-color: #824882;
            color: var(--main);
        }

        .filter-tab.active {
            background-color: #824882;
            color: var(--main);
        }

        .tab-pip {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* ── Notification items ── */
        .notif-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .date-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--secondary);
            opacity: 0.5;
            padding: 14px 4px 4px;
        }

        .notif-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 14px 16px;
            border-radius: 20px;
            border: 2px solid transparent;
            background-color: transparent;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            animation: fadeUp 0.25s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .notif-item:hover { border-color: #824882; }

        .notif-item.unread {
            border-color: rgba(130, 72, 130, 0.45);
            background-color: rgba(130, 72, 130, 0.07);
        }

        .notif-item.unread::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            height: 40%;
            width: 3px;
            border-radius: 0 3px 3px 0;
            background: var(--accent);
        }

        .notif-avatar-wrap { position: relative; flex-shrink: 0; }

        .notif-avatar {
            width: 46px;
            height: 46px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid #824882;
        }

        .notif-type-badge {
            position: absolute;
            bottom: -4px;
            right: -4px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid var(--main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            font-weight: 700;
            color: #fff;
        }

        .badge-like    { background: #e05c7a; }
        .badge-dislike { background: #5c7ae0; }
        .badge-share   { background: #5cb88a; }
        .badge-follow  { background: #824882; }
        .badge-reply   { background: #e09a5c; }
        .badge-mention { background: var(--accent); }

        .notif-body { flex: 1; min-width: 0; }

        .notif-text {
            font-size: 14px;
            line-height: 1.5;
            color: var(--posts);
            font-family: 'Figtree';
        }

        .notif-text .sender-name { font-weight: 700; }
        .notif-text .action-desc { font-weight: 400; color: var(--secondary); }

        .notif-preview {
            margin-top: 5px;
            font-size: 12px;
            color: var(--secondary);
            opacity: 0.7;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 4px 10px;
            border-left: 2px solid #824882;
            font-style: italic;
        }

        .notif-time {
            font-size: 11px;
            color: var(--secondary);
            opacity: 0.6;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .unread-pip {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent);
            display: inline-block;
            flex-shrink: 0;
        }

        .notif-dismiss {
            flex-shrink: 0;
            opacity: 0;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1.5px solid #824882;
            background: transparent;
            color: var(--secondary);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-family: 'Figtree';
        }

        .notif-item:hover .notif-dismiss { opacity: 1; }

        .notif-dismiss:hover {
            background: #c0506e;
            border-color: #c0506e;
            color: #fff;
        }

        /* ── Empty state ── */
        .empty-state {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            color: var(--secondary);
            opacity: 0.5;
            gap: 10px;
        }

        .empty-state.visible { display: flex; }
        .empty-icon { font-size: 42px; }

        .empty-title {
            font-size: 18px;
            font-weight: 700;
            font-family: 'Figtree';
            color: var(--posts);
        }

        .empty-sub {
            font-size: 13px;
            text-align: center;
            max-width: 280px;
        }

        /* ── Skeleton loaders ── */
        .skeleton-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 14px 16px;
            border-radius: 20px;
            border: 2px solid rgba(130,72,130,0.2);
        }

        .sk {
            background: linear-gradient(90deg, rgba(130,72,130,0.08) 25%, rgba(130,72,130,0.18) 50%, rgba(130,72,130,0.08) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 6px;
        }

        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .sk-avatar { width: 46px; height: 46px; border-radius: 8px; flex-shrink: 0; }
        .sk-lines  { flex: 1; display: flex; flex-direction: column; gap: 8px; padding-top: 4px; }
        .sk-line   { height: 11px; border-radius: 4px; }
        .sk-line.w70 { width: 70%; }
        .sk-line.w40 { width: 40%; }

        /* ── Right col stats widget ── */
        #notif-stats {
            height: auto;
            display: flex;
            flex-direction: column;
            padding: 18px 20px;
            gap: 10px;
        }

        #notif-stats-header {
            font-size: 16px;
            font-weight: 700;
            color: var(--posts);
        }

        .stat-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-label {
            font-size: 13px;
            color: var(--secondary);
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .stat-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .stat-count {
            font-size: 14px;
            font-weight: 700;
            color: var(--posts);
        }

        /* ── Mobile ── */
        @media (max-width: 900px) {
            .notif-feed { width: 80vw; }
        }
    </style>
</head>

<script src="utils.js"></script>
<script>
    const TYPE_META = {
        like:    { icon: '♥', label: 'liked your post',       badgeCls: 'badge-like'    },
        dislike: { icon: '↓', label: 'disliked your post',    badgeCls: 'badge-dislike' },
        share:   { icon: '↗', label: 'shared your post',      badgeCls: 'badge-share'   },
        follow:  { icon: '✦', label: 'started following you', badgeCls: 'badge-follow'  },
        reply:   { icon: '↩', label: 'replied to your post',  badgeCls: 'badge-reply'   },
        mention: { icon: '@', label: 'mentioned you',          badgeCls: 'badge-mention' }
    };

    let allNotifications = [];
    let activeFilter = 'all';
    let notificationsLoaded = false;

    // ── Sidebar profile (independent from notifications) ─────
    function loadProfile() {
        if (typeof getCurrentUser !== 'function') return;
        getCurrentUser(function () {
            const u = window.currentUser;
            if (!u) return;
            document.getElementById('disp-name').textContent = u.displayName || u.username;
            document.getElementById('username').textContent  = '@' + u.username;
            document.getElementById('bio').textContent       = u.bio || '';
            const pfp = document.querySelector('#toprofile img');
            if (pfp) pfp.src = u.profilePic || '../assets/defaultuser.png';
            document.getElementById('profile-link').href = `UserPage.html?userId=${u._id}`;
            initSearch();
        });
    }

    // ── Time helpers ─────────────────────────────────────────
    function timeAgo(dateStr) {
        const diff = (Date.now() - new Date(dateStr)) / 1000;
        if (diff < 60)     return 'just now';
        if (diff < 3600)   return `${Math.floor(diff / 60)}m ago`;
        if (diff < 86400)  return `${Math.floor(diff / 3600)}h ago`;
        if (diff < 604800) return `${Math.floor(diff / 86400)}d ago`;
        return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function dayLabel(dateStr) {
        const d = new Date(dateStr);
        const today = new Date();
        const yesterday = new Date(today);
        yesterday.setDate(today.getDate() - 1);
        if (d.toDateString() === today.toDateString())     return 'Today';
        if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
        return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    }

    // ── Build card ───────────────────────────────────────────
    function buildCard(n, delay) {
        const meta        = TYPE_META[n.type] || { icon: '•', label: 'interacted with you', badgeCls: 'badge-mention' };
        const sender      = n.sender || {};
        const displayName = sender.displayName || sender.username || 'Someone';
        const profilePic  = sender.profilePic  || '../assets/defaultuser.png';

        const card = document.createElement('div');
        card.className = `notif-item${n.read ? '' : ' unread'}`;
        card.dataset.id   = n._id;
        card.dataset.type = n.type;
        card.style.animationDelay = `${delay}ms`;

        const preview = n.post?.content
            ? `<div class="notif-preview">"${n.post.content.slice(0, 80)}${n.post.content.length > 80 ? '…' : ''}"</div>`
            : '';

        card.innerHTML = `
            <div class="notif-avatar-wrap">
                <img class="notif-avatar" src="${profilePic}" alt="${displayName}" onerror="this.src='../assets/defaultuser.png'">
                <div class="notif-type-badge ${meta.badgeCls}">${meta.icon}</div>
            </div>
            <div class="notif-body">
                <div class="notif-text">
                    <span class="sender-name">${displayName}</span>
                    <span class="action-desc"> ${meta.label}</span>
                </div>
                ${preview}
                <div class="notif-time">
                    ${!n.read ? '<span class="unread-pip"></span>' : ''}
                    ${timeAgo(n.createdAt)}
                </div>
            </div>
            <button class="notif-dismiss" title="Dismiss">×</button>
        `;

        card.addEventListener('click', async (e) => {
            if (e.target.closest('.notif-dismiss')) return;
            if (!n.read) {
                await fetch(`/api/notifications/${n._id}/read`, { method: 'PUT' });
                card.classList.remove('unread');
                card.querySelector('.unread-pip')?.remove();
                n.read = true;
                updateUnreadBanner();
            }
        });

        card.querySelector('.notif-dismiss').addEventListener('click', async (e) => {
            e.stopPropagation();
            await fetch(`/api/notifications/${n._id}`, { method: 'DELETE' });
            card.style.transition = 'opacity 0.2s, transform 0.2s';
            card.style.opacity    = '0';
            card.style.transform  = 'translateX(16px)';
            setTimeout(() => {
                card.remove();
                allNotifications = allNotifications.filter(x => x._id !== n._id);
                updateUnreadBanner();
                updateStats();
                checkEmpty();
            }, 200);
        });

        return card;
    }

    // ── Render ───────────────────────────────────────────────
    function renderList() {
        const list = document.getElementById('notif-list');
        list.innerHTML = '';

        const filtered = activeFilter === 'all'
            ? allNotifications
            : allNotifications.filter(n => n.type === activeFilter);

        if (filtered.length === 0) { checkEmpty(true); return; }
        checkEmpty(false);

        let lastDay = null;
        filtered.forEach((n, i) => {
            const day = dayLabel(n.createdAt);
            if (day !== lastDay) {
                const lbl = document.createElement('div');
                lbl.className   = 'date-label';
                lbl.textContent = day;
                list.appendChild(lbl);
                lastDay = day;
            }
            list.appendChild(buildCard(n, i * 25));
        });
    }

    function updateUnreadBanner() {
        const unread = allNotifications.filter(n => !n.read).length;
        const banner = document.getElementById('unreadBanner');
        const text   = document.getElementById('unreadText');
        if (unread > 0) {
            banner.classList.remove('hidden');
            text.textContent = `${unread} unread notification${unread !== 1 ? 's' : ''}`;
        } else {
            banner.classList.add('hidden');
        }
    }

    function updateStats() {
        const counts = { like: 0, dislike: 0, share: 0, follow: 0, reply: 0 };
        allNotifications.forEach(n => { if (counts[n.type] !== undefined) counts[n.type]++; });
        Object.entries(counts).forEach(([type, count]) => {
            const el = document.getElementById(`stat-${type}`);
            if (el) el.textContent = count;
        });
    }

    function checkEmpty(force) {
        const list  = document.getElementById('notif-list');
        const empty = document.getElementById('emptyState');
        empty.classList.toggle('visible', force || list.children.length === 0);
    }

    // ── Load notifications (same pattern as working version) ─
    async function loadNotifications() {
        try {
            const res  = await fetch('/api/notifications');
            const json = await res.json();

            // Remove skeletons by ID (same as working version)
            ['sk1', 'sk2', 'sk3'].forEach(id => document.getElementById(id)?.remove());

            notificationsLoaded = true;

            if (!json.success) {
                console.error('Notification fetch failed:', json.error);
                checkEmpty(true);
                return;
            }

            allNotifications = json.data || [];
            updateUnreadBanner();
            updateStats();
            renderList();
        } catch (err) {
            console.error('Notification load error:', err);
            ['sk1', 'sk2', 'sk3'].forEach(id => document.getElementById(id)?.remove());
            notificationsLoaded = true;
            checkEmpty(true);
        }
    }

    // ── Filter tabs ──────────────────────────────────────────
    document.querySelectorAll('.filter-tab').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeFilter = btn.dataset.filter;
            renderList();
        });
    });

    document.getElementById('markAllReadBtn').addEventListener('click', async () => {
        await fetch('/api/notifications/mark-read', { method: 'PUT' });
        allNotifications.forEach(n => n.read = true);
        updateUnreadBanner();
        document.querySelectorAll('.notif-item.unread').forEach(el => {
            el.classList.remove('unread');
            el.querySelector('.unread-pip')?.remove();
        });
    });

    document.getElementById('clearAllBtn').addEventListener('click', async () => {
        if (!confirm('Clear all notifications?')) return;
        await fetch('/api/notifications', { method: 'DELETE' });
        allNotifications = [];
        document.getElementById('notif-list').innerHTML = '';
        updateUnreadBanner();
        updateStats();
        checkEmpty(true);
    });

    // ── Search ───────────────────────────────────────────────
    function initSearch() {
        const searchInput   = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');
        let timer;

        searchInput.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter') return;
            const query = searchInput.value.trim();
            if (!query) return;
            searchResults.style.display = 'none';
            window.location.href = `main timeline.html?q=${encodeURIComponent(query)}`;
        });

        searchInput.addEventListener('keyup', () => {
            clearTimeout(timer);
            timer = setTimeout(async () => {
                const query = searchInput.value.trim();
                if (!query) { searchResults.innerHTML = ''; searchResults.style.display = 'none'; return; }
                try {
                    const res    = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                    const result = await res.json();
                    searchResults.innerHTML = '';
                    if (!result.success) return;
                    result.data.users.forEach(user => {
                        const d = document.createElement('div');
                        d.className = 'search-user';
                        d.innerHTML = `<img src="${user.profilePic || '../assets/defaultuser.png'}" width="30"><span>${user.username}</span>`;
                        d.addEventListener('click', () => { window.location.href = `/UserPage.html?userId=${user._id}`; });
                        searchResults.appendChild(d);
                    });
                    if (!result.data.users.length) searchResults.innerHTML = "<div class='no-results'>No users found</div>";
                    searchResults.style.display = 'block';
                } catch (err) { console.error('Search error:', err); }
            }, 300);
        });
    }

    // ── Boot — both run independently ────────────────────────
    loadProfile();
    loadNotifications();

    // Fallback: if fetch never completed after 3s, clear skeletons
    setTimeout(() => {
        if (!notificationsLoaded) {
            ['sk1', 'sk2', 'sk3'].forEach(id => document.getElementById(id)?.remove());
            checkEmpty(true);
        }
    }, 3000);
</script>
</html>
