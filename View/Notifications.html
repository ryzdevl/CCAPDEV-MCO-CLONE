<!DOCTYPE html>
<html>
<head>
    <title>Notifications — Inkling</title>
    <link rel="stylesheet" href="../stylesheet.css">
    <link rel="stylesheet" href="tl.css">
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Notifications-Design.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="text/javascript" src="/Controller/themeswitch.js" defer></script>
    <script src="/Controller/Notifications.js" defer></script>
</head>

<body>

    <div class="header">
        <img src="../assets/logo-icon-light.png" id="logo">
        <img src="../assets/logo-icon.png" id="logo-dark">
    </div>

    <button id="theme-switch">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M565-395q35-35 35-85t-35-85q-35-35-85-35t-85 35q-35 35-35 85t35 85q35 35 85 35t85-35Zm-226.5 56.5Q280-397 280-480t58.5-141.5Q397-680 480-680t141.5 58.5Q680-563 680-480t-58.5 141.5Q563-280 480-280t-141.5-58.5ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Zm326-268Z"/></svg>
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Zm0-80q88 0 158-48.5T740-375q-20 5-40 8t-40 3q-123 0-209.5-86.5T364-660q0-20 3-40t8-40q-78 32-126.5 102T200-480q0 116 82 198t198 82Zm-10-270Z"/></svg>
    </button>

    <!-- Left sidebar -->
    <div class="left-col">
        <div class="tlelement" id="searchbar">
            <button id="search-button">
                <img src="../assets/search.png">
            </button>
            <input type="text" id="search-input" placeholder="Search...">
        </div>
        <div id="search-results"></div>
        <div class="tlelement" id="sidebar">
            <a href="#" id="profile-link">
                <button id="toprofile" data-user-id="">
                    <img src="../assets/defaultuser.png" class="profile-pfp">
                    <div class="toprofile-text">
                        <span id="disp-name"></span>
                        <span id="username"></span>
                        <span id="bio"></span>
                    </div>
                </button>
            </a>
            <hr class="divider">
            <a href="main timeline.html" id="tohome" class="sidebar-btn">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M240-200h120v-240h240v240h120v-360L480-740 240-560v360Zm-80 80v-480l320-240 320 240v480H520v-240h-80v240H160Zm320-350Z"/></svg>
                <span id="tohome-text"> Home </span>
            </a>
            <a href="Notifications.html" id="toalerts" class="sidebar-btn">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M160-200v-80h80v-280q0-83 50-147.5T420-792v-28q0-25 17.5-42.5T480-880q25 0 42.5 17.5T540-820v28q80 20 130 84.5T720-560v280h80v80H160Zm320-300Zm0 420q-33 0-56.5-23.5T400-160h160q0 33-23.5 56.5T480-80ZM320-280h320v-280q0-66-47-113t-113-47q-66 0-113 47t-47 113v280Z"/></svg>
                <span id="toalerts-text"> Alerts </span>
            </a>
            <a href="" id="tosettings" class="sidebar-btn">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="m370-80-16-128q-13-5-24.5-12T307-235l-119 50L78-375l103-78q-1-7-1-13.5v-27q0-6.5 1-13.5L78-585l110-190 119 50q11-8 23-15t24-12l16-128h220l16 128q13 5 24.5 12t22.5 15l119-50 110 190-103 78q1 7 1 13.5v27q0 6.5-2 13.5l103 78-110 190-118-50q-11 8-23 15t-24 12L590-80H370Zm70-80h79l14-106q31-8 57.5-23.5T639-327l99 41 39-68-86-65q5-14 7-29.5t2-31.5q0-16-2-31.5t-7-29.5l86-65-39-68-99 42q-22-23-48.5-38.5T533-694l-13-106h-79l-14 106q-31 8-57.5 23.5T321-633l-99-41-39 68 86 64q-5 15-7 30t-2 32q0 16 2 31t7 30l-86 65 39 68 99-42q22 23 48.5 38.5T427-266l13 106Zm42-180q58 0 99-41t41-99q0-58-41-99t-99-41q-59 0-99.5 41T342-480q0 58 40.5 99t99.5 41Zm-2-140Z"/></svg>
                <span id="tosettings-text"> Settings </span>
            </a>
        </div>
    </div>

    <!-- Right sidebar -->
    <div class="right-col">
        <div class="tlelement" id="notif-stats">
            <span id="notif-stats-header">Activity Summary</span>
            <hr class="divider">
            <div class="stat-row">
                <span class="stat-label"><span class="stat-dot" style="background:#e05c7a"></span> Likes</span>
                <span class="stat-count" id="stat-like">—</span>
            </div>
            <div class="stat-row">
                <span class="stat-label"><span class="stat-dot" style="background:#5c7ae0"></span> Dislikes</span>
                <span class="stat-count" id="stat-dislike">—</span>
            </div>
            <div class="stat-row">
                <span class="stat-label"><span class="stat-dot" style="background:#5cb88a"></span> Shares</span>
                <span class="stat-count" id="stat-share">—</span>
            </div>
            <div class="stat-row">
                <span class="stat-label"><span class="stat-dot" style="background:#824882"></span> Follows</span>
                <span class="stat-count" id="stat-follow">—</span>
            </div>
            <div class="stat-row">
                <span class="stat-label"><span class="stat-dot" style="background:#e09a5c"></span> Replies</span>
                <span class="stat-count" id="stat-reply">—</span>
            </div>
        </div>
    </div>

    <!-- Notifications feed -->
    <div class="notif-feed">
        <div class="notif-header">
            <div class="notif-header-left">
                <span class="notif-title">Notifications</span>
            </div>
            <div class="notif-header-actions">
                <button class="notif-action-btn" id="markAllReadBtn">Mark all read</button>
                <button class="notif-action-btn danger" id="clearAllBtn">Clear all</button>
            </div>
        </div>

        <div class="unread-banner hidden" id="unreadBanner">
            <span class="unread-dot"></span>
            <span id="unreadText">You have unread notifications</span>
        </div>

        <div class="filter-bar">
            <button class="filter-tab active" data-filter="all">All</button>
            <button class="filter-tab" data-filter="like">
                <span class="tab-pip" style="background:#e05c7a"></span>Likes
            </button>
            <button class="filter-tab" data-filter="dislike">
                <span class="tab-pip" style="background:#5c7ae0"></span>Dislikes
            </button>
            <button class="filter-tab" data-filter="share">
                <span class="tab-pip" style="background:#5cb88a"></span>Shares
            </button>
            <button class="filter-tab" data-filter="follow">
                <span class="tab-pip" style="background:#824882"></span>Follows
            </button>
            <button class="filter-tab" data-filter="reply">
                <span class="tab-pip" style="background:#e09a5c"></span>Replies
            </button>
        </div>

        <!-- Skeletons now have IDs so they can be removed properly -->
        <div class="notif-list" id="notif-list">
            <div class="skeleton-item" id="sk1">
                <div class="sk sk-avatar"></div>
                <div class="sk-lines">
                    <div class="sk sk-line w70"></div>
                    <div class="sk sk-line w40"></div>
                </div>
            </div>
            <div class="skeleton-item" id="sk2">
                <div class="sk sk-avatar"></div>
                <div class="sk-lines">
                    <div class="sk sk-line w70"></div>
                    <div class="sk sk-line w40"></div>
                </div>
            </div>
            <div class="skeleton-item" id="sk3">
                <div class="sk sk-avatar"></div>
                <div class="sk-lines">
                    <div class="sk sk-line w70"></div>
                    <div class="sk sk-line w40"></div>
                </div>
            </div>
        </div>

        <div class="empty-state" id="emptyState">
            <div class="empty-sub">When someone likes, shares, or replies to your posts, it'll show up here.</div>
        </div>
    </div>

</body>

<script src="utils.js"></script>

</html>
