<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile Settings</title>
    <link rel="stylesheet" href="Profile-Edit.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<div class="containersettings">

    <!-- LEFT COLUMN -->
    <div class="profile-column">
        <div class="profile-pic-section">
            <label for="profilePic" class="upload-btn">
                <img id="profilePreview" src="../assets/defaultuser.png" alt="Profile Picture" class="image" />
            </label>
            <h3>Profile Picture</h3>
            <label for="profilePic" class="btn">Change Photo</label>
            <input type="file" id="profilePic" accept="image/*" style="display:none" />
        </div>

        <div class="cover-pic-section">
            <label for="coverPic" class="upload-btn">
                <img id="coverPreview" src="../assets/defaultcover.jpg" alt="Cover Picture" class="cover" />
            </label>
            <h3>Cover Picture</h3>
            <label for="coverPic" class="btn">Change Cover</label>
            <input type="file" id="coverPic" accept="image/*" style="display:none" />
        </div>
    </div>

    <!-- RIGHT COLUMN -->
    <div class="forms-column">

        <div class="setting">
            <h3>Username</h3>
            <input type="text" name="username" placeholder="@username">
        </div>

        <div class="setting">
            <h3>Display Name</h3>
            <input type="text" name="displayname" placeholder="New Display Name">
        </div>

        <div class="bio">
            <h3>Bio</h3>
            <textarea name="bio" placeholder="About Me" rows="4"></textarea>
        </div>

        <div class="setting">
            <h3>Tags</h3>
            <div id="tags-container" style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;"></div>
            <div style="display:flex; gap:6px; align-items:center;">
                <input type="text" id="tag-input" placeholder="Add a tag..." maxlength="30" style="flex:1;">
                <button type="button" id="add-tag-btn" class="addbtn">+ Add Tag</button>
            </div>
        </div>

        <div class="setting">
            <h3>Location</h3>
            <input type="text" name="location" placeholder="City / Country (Optional)">
        </div>

        <div class="setting">
            <h3>More Contacts</h3>
            <div id="contact-links-container"></div>
            <button type="button" id="add-contact-link" class="addbtn">+ Add Contact Link</button>
        </div>

    </div>

    <!-- SAVE SECTION -->
    <div class="save-section">
        <button type="button" class="btn" id="save-profile-btn">Save Changes</button>
        <button type="button" class="btn" id="clearChanges">Discard Changes</button>
    </div>

</div>

<script src="utils.js"></script>
<script src="Profile-Edit.js"></script>
</body>
</html>
